[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-mlx"
version = "0.1.0"
description = "Native MLX inference for Laya typed decision models on Apple silicon"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "mlx>=0.32.2,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=1.26",
  "huggingface-hub>=0.34,<2",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "build>=1"]
reference = ["torch>=2.14,<3", "transformers>=5.17,<6", "safetensors>=0.6"]
benchmark = ["matplotlib>=3.10", "pyarrow>=18"]

[project.scripts]
laya-mlx = "laya_mlx.cli:main"

[project.urls]
Repository = "https://github.com/mizorewww/laya-mlx"
Upstream = "https://github.com/NandhaKishorM/laya"

[tool.hatch.build.targets.wheel]
packages = ["laya_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires downloaded Laya checkpoints"]

[tool.ruff]
line-length = 100
extend-exclude = [".upstream"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
