[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-axera"
version = "0.1.0"
description = "Laya typed-decision inference on AXERA NPUs (AX650 / AX8850) with PyAXEngine"
keywords = ["axera", "ax650", "npu", "laya", "typed-decisions", "decision-model", "pyaxengine"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.24",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.23", "pydantic>=2"]
dev = ["pytest>=8", "ruff>=0.12", "build>=1"]

[project.scripts]
laya-axera = "laya_axera.cli:main"

[project.urls]
Repository = "https://github.com/AXERA-TECH/laya-axera"
Models = "https://huggingface.co/AXERA-TECH/Laya"
Upstream = "https://github.com/NandhaKishorM/laya"
MLXPort = "https://github.com/mizorewww/laya-mlx"
Runtime = "https://github.com/AXERA-TECH/pyaxengine"

[tool.hatch.build.targets.wheel]
packages = ["laya_axera"]

[tool.hatch.build.targets.sdist]
include = ["/laya_axera", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an AXERA NPU and downloaded Laya AXModels"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
